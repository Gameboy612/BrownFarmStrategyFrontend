name: Load Blog Entries

on:
  push:
    paths:
      - 'blogs/entries/**'
  workflow_dispatch:

jobs:
  load-blogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run blog loader
        run: python blogs/load_blogs.py