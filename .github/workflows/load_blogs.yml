name: Load Blog Entries

on:
  push:
    paths:
      - 'blogs/entries/**'
  workflow_dispatch:

jobs:
  load-blogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run blog loader
        run: python blogs/load_blogs.py

      - name: Commit updated blog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/blogs.json
          git diff --staged --quiet || (git commit -m "chore: update blog entries" && git push)